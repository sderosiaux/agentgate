name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per branch. A second push cancels the first: nothing here is a deployment, and a
# queue of stale runs is a queue nobody reads.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned to the version docker-compose.yml runs. A parity suite proving the rego agrees with
  # the builtin engine on a different OPA than the one deployed proves the wrong thing.
  OPA_VERSION: 1.19.0

jobs:
  # Everything that needs neither a database nor a network: fast, and first, so a typo does not
  # wait behind a Postgres container starting.
  static:
    name: Types and formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm -r typecheck

  policies:
    name: Rego
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OPA
        run: |
          curl -sSL -o /usr/local/bin/opa \
            "https://openpolicyagent.org/downloads/v${OPA_VERSION}/opa_linux_amd64_static"
          chmod +x /usr/local/bin/opa
          opa version
      - run: opa test policies/ --verbose
      # --strict turns unused declarations and shadowed variables into errors. A rego file that
      # loads is not a rego file that says what its author meant.
      - run: opa check --strict policies/

  test:
    name: Test suites
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: agentgate
          POSTGRES_PASSWORD: agentgate
          POSTGRES_DB: agentgate
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U agentgate -d agentgate"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Install OPA
        run: |
          curl -sSL -o /usr/local/bin/opa \
            "https://openpolicyagent.org/downloads/v${OPA_VERSION}/opa_linux_amd64_static"
          chmod +x /usr/local/bin/opa

      - name: Start OPA against the committed policies
        run: |
          opa run --server --addr 127.0.0.1:8181 --log-level error policies/ &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8181/health > /dev/null && exit 0
            sleep 1
          done
          echo "OPA never became healthy"; exit 1

      - name: Create .env
        run: |
          cp .env.example .env
          # The example file addresses the database by its compose hostname; on a runner the
          # service container is on localhost.
          sed -i 's#@postgres:5432#@localhost:5432#' .env

      - name: Migrate both databases
        run: make db-migrate

      - name: Every workspace suite, leak scan included
        # `tests/security/secret-leak.test.ts` is part of this run: it executes a host-mode demo
        # and then greps the transcript, both databases, every management GET, the OpenAPI
        # document and every console page. It needs a built console to have pages to read.
        #
        # OPA_URL is exported here so the parity tests run inside the main suite rather than
        # only in the step below. Locally, without it, this run is 626 passing and 45 skipped.
        env:
          OPA_URL: http://127.0.0.1:8181
        run: |
          pnpm --filter @agentgate/web build
          pnpm -r test

      - name: Keep the leak scan's verdict
        # The scan writes its findings to a file as well as to stderr, because a finding lost to
        # a truncated log is a finding nobody can act on. That has happened once already, on a
        # developer's terminal, and the occurrences were never recovered.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leak-report-suites
          path: artifacts/leak-report.txt
          if-no-files-found: ignore

      # Both OPA-gated suites are `skipIf(!OPA_URL)`, which means the default way to run them is
      # not to: 45 tests that say "the rego and the builtin engine agree" and skip in silence.
      # The step above sets the variable, and this one proves the variable had an effect — one
      # skipped test in either package fails the build. Without it, a broken OPA startup would
      # turn the parity claim off and the suite would still be green.
      - name: Prove the parity suites actually ran
        env:
          OPA_URL: http://127.0.0.1:8181
        run: |
          set -e
          fail=0
          check() {
            local package="$1" report="$2"
            shift 2
            pnpm --filter "$package" exec vitest run "$@" \
              --reporter=json --outputFile="$report"
            local skipped
            skipped=$(node -e "
              const r = require('$report');
              process.stdout.write(String(r.numPendingTests + r.numTodoTests));
            ")
            echo "$package: $skipped skipped"
            if [ "$skipped" != "0" ]; then
              echo "::error::$skipped test(s) in $package were skipped with OPA_URL set."
              echo "::error::The parity suite did not run. A green result there means nothing."
              fail=1
            fi
          }
          check @agentgate/policy /tmp/policy-report.json
          check @agentgate/gateway /tmp/gateway-opa-report.json test/proxy-opa.test.ts
          exit "$fail"

  # The compose path, which is the one the README's quickstart tells people to run and the only
  # one that can prove demo case 0. It has never been executed on the machine this was written
  # on — no Docker daemon — so this job is where it runs for the first time.
  demo:
    name: Demo (compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Refuse to pretend
        # `make demo` needs a daemon. If this runner has none, the job fails rather than
        # silently falling back to host mode: host mode skips case 0, and a demo job that
        # quietly stops proving network isolation is worse than one that goes red.
        run: docker info

      - run: cp .env.example .env
      - name: Build and start the stack
        run: docker compose up --build -d --wait postgres gateway mock-github web

      - name: make demo
        # Kept verbatim, because it is what the scan below reads. `pipefail` so that a failing
        # demo is a failing step rather than a successful `tee`.
        run: |
          set -o pipefail
          mkdir -p artifacts
          make demo 2>&1 | tee artifacts/demo-output.txt

      - name: Migrate the host-side databases
        # The scan below starts its own gateway to sweep the management API, and compose
        # publishes Postgres on localhost for exactly this kind of host-side access.
        run: make db-migrate

      - name: Leak scan, over the compose run this time
        # LEAK_SCAN_DATABASE_URL is the whole point of this step. The scan starts its own gateway
        # to sweep the management API, and by default that gateway reads DATABASE_URL_TEST —
        # correct for a host-mode demo, wrong here, where the demo ran in containers against the
        # compose database. Without this the sweep rakes an empty schema and calls it clean.
        #
        # What this run covers that the suites job does not: the transcript is the *container*
        # demo, and a daemon exists, so `docker compose logs` is read instead of skipped.
        #
        # What it still does not cover, stated rather than implied: the console stage skips,
        # because the console here is a container and the stage looks for a local Next build.
        # The compose console's own output is inside `docker compose logs`, which is scanned.
        env:
          LEAK_SCAN_DATABASE_URL: postgresql://agentgate:agentgate@localhost:5432/agentgate
        run: node scripts/leak-scan.mjs --transcript artifacts/demo-output.txt

      - name: Keep the leak scan's verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leak-report-compose
          path: artifacts/leak-report.txt
          if-no-files-found: ignore

      - name: Keep the transcript, but only when something went wrong
        # On failure only. The transcript is the evidence for a demo that broke, and it also
        # contains the mission token case 2 prints by design — dead by then, since case 6
        # expires that mission in the same run, but there is no reason to publish it on every
        # green build for the sake of it.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: demo-output
          path: artifacts/demo-output.txt
          if-no-files-found: warn

      - name: What the containers said
        if: always()
        run: docker compose logs --no-color --tail 200

      - name: Stop
        if: always()
        run: docker compose down -v
