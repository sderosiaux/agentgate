name: agentgate

networks:
  # Agent-side network: no route to the outside world. The demo agent can only
  # reach the gateway, never the upstream services.
  agent-net:
    internal: true
  # Service-side network: gateway, database, mock-github and (later) web, opa.
  service-net:

volumes:
  postgres-data:

services:
  postgres:
    image: postgres:18-alpine
    networks: [service-net]
    environment:
      POSTGRES_USER: agentgate
      POSTGRES_PASSWORD: agentgate
      POSTGRES_DB: agentgate
    ports:
      # Exposed on the host so `pnpm -r test` can run integration tests against
      # this instance. Override POSTGRES_PORT when 5432 is already taken.
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agentgate -d agentgate']
      interval: 3s
      timeout: 3s
      retries: 20

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    # On agent-net so the demo agent can reach it, on service-net so it can reach
    # the database and the upstream services the agent itself cannot see.
    networks: [agent-net, service-net]
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      PORT: 8080
      # In-network OPA address; only consulted when POLICY_ENGINE=opa.
      OPA_URL: http://opa:8181
    ports:
      # Override GATEWAY_PORT when 8080 is already taken on the host.
      - '${GATEWAY_PORT:-8080}:8080'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://127.0.0.1:8080/healthz\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  mock-github:
    build:
      context: .
      dockerfile: services/mock-github/Dockerfile
    # service-net ONLY, and no published port: the demo agent sits on agent-net and
    # must have no route here. Every call it makes has to go through the gateway,
    # which holds the token this service demands.
    networks: [service-net]
    environment:
      MOCK_GITHUB_TOKEN: ${MOCK_GITHUB_TOKEN:?set MOCK_GITHUB_TOKEN in .env}
      PORT: 3001
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://127.0.0.1:3001/healthz\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  opa:
    image: openpolicyagent/opa:1.19.0
    # Optional: the gateway uses its builtin engine unless POLICY_ENGINE=opa. The container
    # exists so the same rego the parity suite tests can be exercised for real.
    networks: [service-net]
    command:
      - run
      - --server
      - --addr
      - 0.0.0.0:8181
      - --log-level
      - error
      - /policies
    volumes:
      # Read-only: a policy change is a commit, never a container-side edit.
      - ./policies:/policies:ro
    ports:
      # Exposed so the parity suite can run against it. Override OPA_PORT when 8181 is taken.
      - '${OPA_PORT:-8181}:8181'

  demo-agent:
    build:
      context: .
      dockerfile: apps/demo-agent/Dockerfile
    # agent-net ONLY, and this is the whole demonstration: there is no route from here to
    # mock-github, to the database or to the internet. The gateway is the single address this
    # container can resolve, so every request it makes is one somebody decided about.
    networks: [agent-net]
    # Not started by `docker compose up`: the demo agent runs once, says what happened and
    # exits. `make demo` starts it with `docker compose run`, which is what injects the
    # mission token minted for that run.
    profiles: [demo]
    depends_on:
      gateway:
        condition: service_healthy
    # No env_file, on purpose. This container's environment holds a gateway url, a mission
    # token and a credential *alias* — case 2 prints all of it — and .env holds the upstream
    # token the demo is about keeping out of here.
    environment:
      DEMO_MODE: container
    # No ports: nothing connects to the agent. It only ever calls out, to one place.
