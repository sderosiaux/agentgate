name: agentgate

networks:
  # Agent-side network: no route to the outside world. The demo agent can only
  # reach the gateway, never the upstream services.
  agent-net:
    internal: true
  # Service-side network: gateway, database and (later) mock-github, web, opa.
  service-net:

volumes:
  postgres-data:

services:
  postgres:
    image: postgres:17-alpine
    networks: [service-net]
    environment:
      POSTGRES_USER: agentgate
      POSTGRES_PASSWORD: agentgate
      POSTGRES_DB: agentgate
    ports:
      # Exposed on the host so `pnpm -r test` can run integration tests
      # against the same database the gateway uses.
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agentgate -d agentgate']
      interval: 3s
      timeout: 3s
      retries: 20
