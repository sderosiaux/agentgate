name: agentgate

networks:
  # Agent-side network: no route to the outside world. The demo agent can only
  # reach the gateway, never the upstream services.
  agent-net:
    internal: true
  # Service-side network: gateway, database, mock-github and (later) web, opa.
  service-net:

volumes:
  postgres-data:

services:
  postgres:
    image: postgres:18-alpine
    networks: [service-net]
    environment:
      POSTGRES_USER: agentgate
      POSTGRES_PASSWORD: agentgate
      POSTGRES_DB: agentgate
    ports:
      # Exposed on the host so `pnpm -r test` can run integration tests against
      # this instance. Override POSTGRES_PORT when 5432 is already taken.
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agentgate -d agentgate']
      interval: 3s
      timeout: 3s
      retries: 20

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    # On agent-net so the demo agent can reach it, on service-net so it can reach
    # the database and the upstream services the agent itself cannot see.
    networks: [agent-net, service-net]
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      PORT: 8080
    ports:
      # Override GATEWAY_PORT when 8080 is already taken on the host.
      - '${GATEWAY_PORT:-8080}:8080'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://127.0.0.1:8080/healthz\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  mock-github:
    build:
      context: .
      dockerfile: services/mock-github/Dockerfile
    # service-net ONLY, and no published port: the demo agent sits on agent-net and
    # must have no route here. Every call it makes has to go through the gateway,
    # which holds the token this service demands.
    networks: [service-net]
    environment:
      MOCK_GITHUB_TOKEN: ${MOCK_GITHUB_TOKEN:?set MOCK_GITHUB_TOKEN in .env}
      PORT: 3001
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://127.0.0.1:3001/healthz\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
